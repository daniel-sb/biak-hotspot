# Biak hotspot monitoring - FIRMS ingest configuration (Task 01).
# Credentials come from the environment only (FIRMS_MAP_KEY), never from this file.

# West, South, East, North (EPSG:4326). PLAN.md header.
# Widened 2026-08-27 to cover BOTH regencies in full. Kepulauan Mapia (Supiori
# Barat distrik) sits at 134.30E, +0.94N, roughly 300 km northwest of Biak, and
# two Aimando Padaido desa lie east of 136.70. The earlier box excluded all four,
# which would have published them as zero-hotspot districts without ever looking.
# The added area is almost entirely ocean; FIRMS returns only detections and the
# desa polygon clip discards anything not on land.
aoi_bbox_wsen: [134.25, -1.39, 136.76, 0.99]

sources:
  - VIIRS_SNPP_NRT
  - VIIRS_NOAA20_NRT
  - VIIRS_NOAA21_NRT
  - MODIS_NRT

# Default window size for a daily pull. FIRMS accepts max 5 days per request;
# longer windows are chunked automatically in src/ingest_firms.py.
lookback_days: 15

# Phase 2 prerequisite (Task 03): years of history the persistent-source
# filter needs. Do not raise this casually - MODIS reaches back to 2000, and
# pulling all of it wastes an hour to answer a question three years answers.
backfill_years: 3

# Himawari-9 evening coverage (Task 05; PLAN.md 12). The window covers the
# 15:00-00:31 WIT blind hours: 06:00-16:00 UTC. 30-minute cadence - 10-minute
# is available but triples the download for little gain. Sunset 18:15 WIT
# splits day (B07 contaminated by reflected sunlight - unreliable) from the
# trustworthy dark stretch. Anomaly thresholds are provisional starting
# values (PLAN.md 12 has no validated evening climatology); flagged rows are
# recorded, never deleted, and 2 km AHI sees only larger/hotter fires.
himawari_window_utc: ["06:00", "16:00"]
himawari_cadence_minutes: 30
himawari_sunset_wit: "18:15"
himawari_min_anomaly_k: 10.0
himawari_min_bt_diff_k: 10.0
himawari_background_window_px: 15
# Segment check: the AOI must resolve to exactly these HSD segments (derived
# from the navigation block, asserted so a layout change fails loudly).
himawari_expected_segments: [5, 6]

# Recurrent-location flagging (Phase 2 item 1, calibrated on PLAN.md 11.2).
# A cluster (detections within radius_m of a shared centre) is flagged when
# hotspots appear on at least min_days distinct WIT days AND those days span
# at least min_span_days - the span condition is what keeps a one-week fire
# from being called recurrent. Flags only: flagged detections stay in every
# count. Recurrence is computed only when the store spans at least
# min_history_days; below that no flags are emitted at all.
recurrence:
  radius_m: 750
  min_days: 10
  min_span_days: 90
  min_history_days: 365

# Detection climatology baseline (Phase 5 step 2, Task 17): the
# probability of a detection per land grid cell per day-of-year, fitted on
# training years and scored out of sample. Any statistical model must beat
# it to justify its existence (PLAN.md 5).
baseline:
  # Cell side in metres, anchored at the south-west corner of
  # aoi_bbox_wsen. 1 km is coarse next to a 375 m VIIRS pixel, but three
  # years of history is thin: finer cells drive the per-cell-day positive
  # rate toward zero and the climatology toward all-zeros.
  grid_m: 1000
  # Half-width of the day-of-year window, in days. Three years give three
  # samples of any single calendar day, which is not a probability, so the
  # window pools the 31 neighbouring days of the same season. Widening it
  # further starts mixing the wet season in.
  doy_half_window: 15
  # Reliability bins. Detection rates here sit far below 1%, so the bins
  # are dense near zero (Phase 5 asks for a reliability curve; this table
  # is its data).
  reliability_bins: [0, 0.0001, 0.001, 0.01, 0.05, 0.1, 0.2, 1]
  # The fixed constellation the baseline sees every year through. NOAA-21
  # contributes nothing before 2024-02-16 (manifest marks its source
  # unavailable 2023-08-27..2024-01-16; first stored detection 2024-02-16),
  # so counting it would read an extra satellite as extra burning. Keys
  # are the store's satellite values; values are manifest source names.
  constellation:
    N: [VIIRS_SNPP_NRT, VIIRS_SNPP_SP]
    N20: [VIIRS_NOAA20_NRT, VIIRS_NOAA20_SP]
    Terra: [MODIS_NRT, MODIS_SP]
    Aqua: [MODIS_NRT, MODIS_SP]

# METAR corroboration (Phase 2 item 4, Task 19): events against airport
# smoke reports from Frans Kaisiepo (WABB), the one independent ground
# observation available at scale here. The Iowa State archive only, via
# --fetch; everything else reads the raw files.
metar:
  station: WABB
  # Station position per PLAN.md 10.1 (-1.190, 136.108, elevation 12 m).
  lat: -1.190
  lon: 136.108
  # The archive holds WABB from here (PLAN.md 10.2 checked it); earlier
  # years return an empty year that would read as a quiet station.
  archive_start: "2023-09-01"
  # Smoke outlasts the burning that makes it: burning peaked 21-22 August
  # 2026, airport smoke 23-24 (PLAN.md 10.4). 48 h covers that lag with
  # margin.
  lag_hours: 48
  # The upwind test is one sector rule on the reported surface wind, not
  # plume modelling: 45 degrees each side of the station-event bearing.
  sector_half_width_deg: 45
  # Numfor lies 126-148 km from the airport; a single station cannot speak
  # for it. 50 km keeps the corroborated class inside the island cluster
  # the station can plausibly see.
  max_km: 50
  # Below half the expected half-hourly reports the station was not
  # reporting enough to say anything: a data gap, not a negative.
  min_coverage: 0.5

# Himawari-9 onset brackets (Task 20; PLAN.md Phase 4 item 4, PLAN.md 13).
# The last slot at which an event's pixels were clear and quiet, and the
# first slot at which they were anomalously hot: when heat first rose above
# a 2 km sensor's detection floor. A bracket bounds when heat was present;
# it is never a start time, and it says nothing about why or by whom
# (PLAN.md section 8).
himawari_onset:
  # Events below this member count hold too few VIIRS pixels to bracket at
  # 2 km (the burned-area bar of Task 18).
  min_detections: 5
  # Reaching back 12 h lands near the previous VIIRS night overpass, so
  # the bracket can close on a quiet slot from the previous dark pass.
  lookback_hours: 12
  # Slots at and just after the VIIRS look are the validation: if Himawari
  # does not flag the event there, it cannot time it either.
  after_minutes: 30
  # Full AHI scan rate; the evening product runs 30 min, the bracket wants
  # every look.
  cadence_minutes: 10
  # Below this B14 an event pixel counts as obscured (cloud tops are
  # cold). Basis: over the 727 land pixels of the 2026-08-22 evening run,
  # night B14 had median 294.9 K, 5th percentile 286.7 K, and all 37
  # flagged pixels sat above 299 K. Provisional, and NOT a cloud mask:
  # thin cirrus passes it.
  cloud_bt14_k: 285
  # Below this share of usable slots (not missing upstream) a window
  # cannot bracket anything and gets no bracket.
  min_slot_share: 0.8
  # Inclusive WIT days of the burning peak for the AOI-wide diurnal cycle.
  diurnal_days: ["2026-08-21", "2026-08-24"]
  # The F10 field case: E0463's ground was photographed actively smoking
  # on 4 September 2026 at 13:53 WIT with no detection that day. The
  # question is only whether its pixels were obscured around the VIIRS
  # looks of that day.
  named_case: {event_id: E0463, wit_day: "2026-09-04"}

# Fire danger indices (Phase 5 step 1, Task 21): the Canadian FWI system
# and KBDI computed from ERA5-Land per land cell per WIT day, scored
# against the detection record out of sample. They describe how weather
# has dried the fuel - nothing about whether anyone burned land, or why
# (PLAN.md sections 8 and 14).
fire_danger:
  # Indices run continuously from here so the moisture codes carry a real
  # history into 2023-09-01; everything before score_start is discarded.
  spin_up_start: "2022-09-01"
  # The first day the AOI series and the scoring cover.
  score_start: "2023-09-01"
  # Standard start-up values (Van Wagner and Pickett 1985: FFMC 85,
  # DMC 6, DC 15).
  start_codes: {ffmc: 85, dmc: 6, dc: 15}
  # Equatorial day-length constants: between 10S and 10N the DMC
  # effective day length is 9.0 every month and the DC day-length factor
  # 1.39 (Lawson and Armitage 2008; the same rule the cffdrs package's
  # latitude adjustment applies, which uses 1.4). Biak sits near 1S.
  dmc_day_length: 9.0
  dc_day_length_factor: 1.39
  # KBDI: the first 5.08 mm (0.2 inch) of each run of consecutive rainy
  # days is intercepted (Keetch and Byram 1968).
  kbdi_rain_interception_mm: 5.08
  # Mean annual precipitation per cell for KBDI's R: the 1991-2020
  # ERA5-Land total, the standard climate normal window.
  kbdi_mean_rain_period: [1991, 2020]
  # A WIT day counts as a rain day for days_since_rain at or above this.
  rain_day_mm: 1.0

output_paths:
  raw_dir: data/raw
  processed: data/processed/detections.parquet
  # Published files (docs/ is the GitHub Pages root):
  geojson: docs/data/hotspots_latest.geojson
  summary_json: docs/data/summary_latest.json
  brief_dir: docs/briefs

# Rolling window for hotspots_latest.geojson, in WIT days ending on the
# covered day. The brief itself always covers exactly one day.
geojson_window_days: 7

# Desa/kelurahan boundaries for Biak Numfor and Supiori, derived from the
# national BIG geodatabase by scripts/extract_boundary.sh. 306 features.
# Wired into the ingest (src/ingest_firms.py): detections outside every desa
# are kept with on_land = False, never dropped.
admin_polygon: data/boundaries/biak_desa.geojson

# Road network for the AOI, fetched once from OpenStreetMap by
# scripts/fetch_osm_roads.py and tracked so the build and the tests run
# offline. Used to record how far each survey target is from a road a
# motorbike can reach: on Biak the interior has few roads, and a target 300 m
# from the coastal road and one 1.3 km into the karst cost entirely different
# afternoons. (c) OpenStreetMap contributors, ODbL.
road_lines: data/boundaries/biak_roads.geojson

# Burning events (Task 16; PLAN.md Phase 3). Space-time DBSCAN: two
# detections are neighbours when within eps_m metres AND eps_hours of each
# other on datetime_utc; a detection with min_samples - 1 neighbours is core.
# Tuned in Task 16 against the known events below; FINDINGS.md F10 has the
# grid. Read it before changing these, and re-run `python src/events.py
# --tune` after. Any change rebuilds every event ID (registry_version
# increments).
events:
  # Two VIIRS pixels. At 1000 m the Saramom area chains into a 4.5 km event,
  # more than twice the 2 km linear feature PLAN.md 11.4 found there; at
  # 750 m it stays at 2.6 km. Same value as recurrence.radius_m.
  eps_m: 750
  # Burning here is daytime only (PLAN.md 10.4), so a plot burned on two
  # consecutive afternoons is re-detected about a day later - but VIIRS
  # passes between 12:34 and 14:21 WIT and Aqua as late as 15:48, so that
  # gap runs 21-27 h (measured: 21.1-26.9 h over 1,808 same-spot pairs).
  # PLAN.md's 24 h puts 36% of those pairs outside the window on overpass
  # timing alone. 30 h covers the spread and stays far below a two-day gap
  # (44.8 h at its shortest); 36 h gives the same events.
  eps_hours: 30
  # With 2, DBSCAN reduces to connected components: any neighbour makes a
  # core point. Chaining is the risk that brings; the tuning shows the
  # largest event at 3.4 km, so it is not happening at these distances.
  min_samples: 2
  tune_eps_m: [375, 750, 1000, 1500]
  tune_eps_hours: [12, 24, 30, 36, 48]
  # Known events the parameters are checked against (Task 16). Each selects
  # detections by date window and/or a radius around a point; the tuning run
  # reports how many events those detections fall into.
  known_events:
    # PLAN.md 10.4: METAR-corroborated, clean onset and decay. Should be many
    # events - it spans Biak and Numfor, 40 km of sea apart.
    - {name: aug2026, from: "2026-08-19", to: "2026-08-25"}
    # PLAN.md 11.3: burning within 3 km of Frans Kaisiepo, 35 of 39
    # detections in August 2026. Should not chain to 2023 or April 2026.
    - {name: airport, lat: -1.1900, lon: 136.1078, radius_m: 3000}
    # PLAN.md 11.2/11.4: the dominant recurrent site, 74 distinct days over
    # three years. Should be many short events at one place, never one.
    - {name: saramom, lat: -1.1447, lon: 136.0347, radius_m: 750}
    # Detected 3 September 2026, photographed still smoking by the surveyor
    # on 4 September 13:53 WIT and undetected that day.
    - {name: anjareuw, lat: -1.1723, lon: 136.1353, radius_m: 1000,
       from: "2026-09-03", to: "2026-09-04"}

# Burned area per event (Task 18; PLAN.md Phase 4 items 1-3). Sentinel-2
# dNBR+ against a false-alarm-controlled local threshold. Run by hand with
# Earth Engine: python src/burned_area_gee.py <project>.
burned_area:
  # Events this small are one or two overpasses; below five detections the
  # footprint is a few pixels and the area a coin toss (Task 18: 31 events
  # at >= 5 when written).
  min_detections: 5
  # One VIIRS pixel around each member detection; also absorbs its
  # geolocation jitter. Burning outside it is not attributed to the event.
  footprint_m: 375
  # Look windows. Pre ends the day before first_seen; post starts the day
  # after last_seen. 30 days of post is a trade: shorter leaves more cloud
  # gap, longer lets tropical regrowth erase the signal. The look-lag
  # statistics in the output show what each event actually got.
  pre_days: 60
  post_days: 30
  # Cloud Score+ cs_cdf: probability a pixel is clear. 0.6 is the value the
  # other Sentinel-2 composites here use.
  cs_min: 0.6
  # Reference ring for the threshold: land within ref_radius_m of the event
  # centroid and farther than far_m from every detection ever stored - F7's
  # "far" stratum, land never seen hot.
  ref_radius_m: 10000
  far_m: 3000
  # The threshold is this quantile of dNBR+ on the ring: 1% of never-
  # detected land nearby exceeds it. False-alarm-controlled, not calibrated.
  ref_quantile: 0.99
  # 2,500 clear 20 m pixels is 100 ha. Below that the 99th percentile rests
  # on 25 pixels and the event gets no threshold at all.
  min_ref_px: 2500
  scale_m: 20
  # Task 18b. The latest December band in the JRC TMF asset. Events are
  # read against the year before them, capped here: 2026 events use
  # December 2024, about 20 months early. Raise it when TMF v1_2025
  # appears - and change the asset id in burned_area_gee.py with it.
  tmf_latest_year: 2024
